---
# Kopiert alle benötigten Dateien auf die VM, baut dort das Docker-Image
# und startet den Stack via "docker compose" CLI. Bewusst nur
# ansible.builtin-Module (copy, template, file, command) - keine
# community.docker Collection.

- name: Zielverzeichnis auf der VM anlegen
  ansible.builtin.file:
    path: "{{ mssql_remote_dir }}"
    state: directory
    mode: "0750"

- name: Unterverzeichnisse für Datenbank- und Backup-Dateien anlegen
  ansible.builtin.file:
    path: "{{ mssql_remote_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - data
    - backup

- name: Statische Projektdateien kopieren (Dockerfile, SQL-Skripte)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ mssql_remote_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - Dockerfile
    - setup-admin-login.sql
    - setup-backup-job.sql

- name: docker-compose.yml rendern (Host-Port aus mssql_db_port)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mssql_remote_dir }}/docker-compose.yml"
    mode: "0644"

- name: Ausführbare Skripte kopieren
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ mssql_remote_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - entrypoint.sh
    - toggle-sa.sh

- name: .env mit Zugangsdaten aus dem Vault rendern
  ansible.builtin.template:
    src: env.j2
    dest: "{{ mssql_remote_dir }}/.env"
    mode: "0600"
  no_log: true # verhindert, dass Passwörter im Diff/Output landen

- name: Docker-Image bauen
  ansible.builtin.command:
    cmd: docker compose build
    chdir: "{{ mssql_remote_dir }}"
  register: mssql_build
  changed_when: "'CACHED' not in mssql_build.stdout"

- name: Prüfen, dass die WireGuard-Tunnel-IP bereits an einem Interface hängt
  ansible.builtin.command: ip -4 -o addr show
  register: mssql_docker_ip_check
  changed_when: false

- name: Abbrechen mit klarer Meldung, falls die Tunnel-IP fehlt
  ansible.builtin.fail:
    msg: >-
      {{ wireguard_server_ip }} ist auf diesem Host aktuell an keinem
      Interface gebunden. "docker compose up" würde beim Binden des
      DB-Ports mit "cannot assign requested address" fehlschlagen, da
      Docker den Host-Port nur an eine bereits existierende lokale
      Adresse binden kann. Ursache meist: roles/wireguard_server ist
      noch nicht (erfolgreich) gelaufen, oder wg0 ist inaktiv - prüfen
      mit "wg show" bzw. "ip addr show wg0" auf der VM. Die Reihenfolge
      in site.yml muss wireguard_server VOR mssql_docker ausführen.
  when: wireguard_server_ip not in mssql_docker_ip_check.stdout

- name: Stack starten (idempotent - docker compose macht bei bestehendem, unverändertem Container nichts)
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ mssql_remote_dir }}"
  register: mssql_up
  changed_when: "'Started' in mssql_up.stderr or 'Created' in mssql_up.stderr"
