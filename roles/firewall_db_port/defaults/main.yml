---
# Ob diese Rolle überhaupt etwas tun soll. Auf false setzen, wenn der Port
# bereits anderweitig (z. B. Cloud-Security-Group) freigegeben wird und die
# Host-Firewall unangetastet bleiben soll.
firewall_manage: true

# Derselbe Port, unter dem der SQL Server in docker-compose.yml veröffentlicht
# wird (siehe mssql_db_port in group_vars/all/vars.yml). Wird hier erneut
# referenziert, damit die Rolle auch eigenständig (ohne mssql_docker)
# verwendbar ist.
mssql_db_port: 1433
